<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Status do pedido | Popozuda</title><style>body{background:#faf2ef;color:#301521;font:15px/1.6 Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}.box{background:#fff;padding:45px 32px;text-align:center;max-width:540px;border-radius:10px;border:1px solid #ebd9df;margin:20px}.brand{font-size:35px;color:#980d3e;font-weight:900;letter-spacing:-2px}a{color:#980d3e}p{color:#66565a}</style></head><body><main class="box"><div class="brand">popozuda♥</div><h1 id="message">Verificando pagamento...</h1><p id="details">Aguarde enquanto consultamos o status do pedido diretamente na Stripe.</p><a href="/">Voltar à loja</a></main><script>
const params=new URLSearchParams(location.search),id=params.get('payment_intent');
async function check(){if(!id){set('Pedido não localizado','Não foi possível identificar o pagamento. Consulte o suporte com os dados do pedido.');return}
try{const response=await fetch('/api/order-status?payment_intent='+encodeURIComponent(id),{cache:'no-store'});if(!response.ok)throw new Error('status indisponível');const result=await response.json();if(result.paid||result.status==='succeeded'){set('Pagamento confirmado!','Seu pagamento foi aprovado pela Stripe. Guarde o e-mail de confirmação.');localStorage.removeItem('popozuda_cart');}
else if(result.status==='processing'||result.status==='requires_action'){set('Pagamento em processamento','Seu pedido ainda aguarda confirmação. Atualize a página mais tarde.');}
else if(result.status==='requires_payment_method'){set('Pagamento não concluído','A Stripe ainda não confirmou o pagamento. Volte ao checkout para tentar novamente.');}
else{set('Aguardando confirmação','O pagamento ainda não foi confirmado. Verifique novamente em alguns instantes.')}}catch{set('Não foi possível consultar o pagamento','Ainda não temos confirmação do pagamento. Não refaça a cobrança sem antes verificar a Stripe.')}}
function set(t,m){document.getElementById('message').textContent=t;document.getElementById('details').textContent=m}check();</script></body></html>
